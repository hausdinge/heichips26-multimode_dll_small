project-name: Small standard-cell clock generator
top-cell: heichips26_multimode_dll_small
team-members:
  - Kevin Klein
  - Nils Kissner
slot-size: tiny
analog-pins: 2
uses-vapwr: false
short-description: Frequency multiplication with two related programmable divided clocks.
long-description: |
  A flat standard-cell frequency-locked loop in the fixed 200 x 200 um tiny
  analog template. One tunable ring oscillator drives two integer dividers.
  A five-bit multiplier and two five-bit dividers are configured in parallel.
  Both outputs share a reset epoch; their phase is not locked to the reference.
  The design uses no tri-state or dedicated delay-gate cells.
  The two clock outputs are available to the fabric and on analog_0/analog_1.
  See macros/heichips26_multimode_dll_small/README.md for configuration,
  measurement conditions, verification results and reproducible commands.
gds-path: macros/heichips26_multimode_dll_small/final/gds/*.gds
lef-path: macros/heichips26_multimode_dll_small/final/lef/*.lef
header-path: macros/heichips26_multimode_dll_small/final/vh/*.vh
